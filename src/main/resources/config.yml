# Summit CustomArmor Configuration

# Storage backend: 'yaml' (default, no setup required) or 'mariadb'
storage-type: yaml

# Prefix used in chat messages. Use %prefix% in any message string.
# Supports & codes, <#RRGGBB> hex, <gradient:#hex1:#hex2>text</gradient>,
# and all MiniMessage tags: https://docs.advntr.dev/minimessage/format.html
prefix: "<dark_gray>[<gradient:#4DCCFF:#FFFFFF>CustomArmor</gradient><dark_gray>]<reset>"

unbind-scroll:
  material: PAPER
  name: "&fUnbind Scroll"
  lore:
    - "&7Drag onto a soulbound armor piece"
    - "&7to remove its binding."

database:
  host: localhost
  port: 3306
  database: summit_customarmor
  username: root
  password: changeme

proc:
  base-per-piece: 0.02        # Base chance contributed by each worn piece
  increase-per-level: 0.002   # Additional chance per level on each piece
  max-total-chance: 0.15      # Hard cap on final chance
  set-bonus:
    1: 1.0
    2: 1.1
    3: 1.25

  keys:
    common:
      chance: 75
      display-name: "&eCommon Key"
      message: "&eYou found a &eCommon Key&e!"
      commands:
        - "crate give %player% crate_lost physical 1"
    rare:
      chance: 25
      display-name: "&bRare Key"
      message: "&bYou found a &bRare Key&b!"
      commands:
        - "crate give %player% crate_explorer physical 1"
    epic:
      chance: 0
      display-name: "&5Epic Key"
      message: "&5You found an &5Epic Key&5!"
      commands:
        - "crate give %player% crate_mystic physical 1"
    legendary:
      chance: 0
      display-name: "&6Legendary Key"
      message: "&6You found a &6Legendary Key&6!"
      commands:
        - "crate give %player% crate_legendary physical 1"

messages:
  # All messages support %prefix%, & codes, <#RRGGBB> hex, and MiniMessage tags.
  # Examples:
  #   equip-1: "%prefix% &7You equipped &b1/3 &7Key Finder pieces."
  #   equip-3: "%prefix% <gradient:#FFD700:#FF8C00>Full set equipped!</gradient>"
  equip-1: "%prefix% &7You equipped &b1/3 &7Key Finder pieces."
  equip-2: "%prefix% &aYou equipped &b2/3 &aKey Finder pieces! Bonus active."
  equip-3: "%prefix% &6Full set! All &b3/3 &6Key Finder pieces equipped!"
  soulbound-blocked: "%prefix% &cThis armor is soulbound to another player."
  not-soulbound: "%prefix% &7This armor piece is not soulbound."
  unbound: "%prefix% &aSoulbound removed from armor piece."

armor:
  # Lore shown on each piece. Supports & codes, <#RRGGBB> hex, MiniMessage tags.
  # Placeholders:
  #   %level%        — current level
  #   %max_level%    — maximum level
  #   %xp%           — current XP (shows -- at max level)
  #   %xp_required%  — XP needed for next level (shows -- at max level)
  #   %owner%        — name of the bound player, or "Unbound"
  #   %prefix%       — the configured prefix
  # Use '' for a blank line. Gradient example:
  #   - "<gradient:#4DCCFF:#FFFFFF>Level: %level%/%max_level%</gradient>"
  lore:
    - ""
    - "&6Level: &e%level%&6/&e%max_level%"
    - "&7XP: &f%xp%&7/&f%xp_required%"
    - "&7Owner: &f%owner%"

  # Armor piece names also support all colour formats.
  # Gradient example: "<gradient:#4DCCFF:#FFFFFF>Key Finder Chestplate</gradient>"
  chestplate:
    name: "<gradient:#4DCCFF:#FFFFFF>Key Finder Chestplate</gradient>"
    material: LEATHER_CHESTPLATE
    color: "#4DCCFF"      # Hex color — only used for leather armor.

  leggings:
    name: "<gradient:#4DCCFF:#FFFFFF>Key Finder Leggings</gradient>"
    material: LEATHER_LEGGINGS
    color: "#4DCCFF"

  boots:
    name: "<gradient:#4DCCFF:#FFFFFF>Key Finder Boots</gradient>"
    material: LEATHER_BOOTS
    color: "#4DCCFF"

leveling:
  max-level: 25
  base-xp: 100
  xp-scaling: 1.5

  # Toggle which activities grant XP and trigger proc chances.
  # Set to false to disable that activity entirely.
  enabled:
    mining: true
    farming: true
    fishing: true

  xp-gain:
    mining: 1
    farming: 1
    fishing: 2
